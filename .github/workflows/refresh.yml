name: Refresh events

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.js
      - name: Commit if the calendar changed
        run: |
          git config user.name "dragons-calendar-bot"
          git config user.email "actions@github.com"
          git add events.json
          git diff --cached --quiet || git commit -m "Refresh events"
          git push
